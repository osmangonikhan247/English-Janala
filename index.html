<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/10a4595e8d.js" crossorigin="anonymous"></script>
    <title>English | জানালা</title>
     <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
     <script src="styles.css"></script>
     <style>
        .hidden-section {
            display: none !important;
        }
    </style>
</head>
<body class="bg-white text-black">
    <!-- section 1 Login page  -->
    <section id="loader_page" class="fixed top-0 left-0 w-full h-screen bg-white flex justify-center items-center flex-col z-50">
        <div class="w-auto h-12 border-gray-300 border-t-gray-700 loading loading-dots loading-xl"></div>
        <div class="font-bold text-[25px]">Welcome To</div>
        <div class="flex items-center">English<img src="assets/logo.png" alt="" class="h-6 mx-1">জানালা</div>
    </section>

    <dialog id="openning_massage" class="modal">
        <div id="openning_modal_container"></div>
    </dialog>
    <!-- section 1 login page done  -->

<section id="web_page" class="hidden">
        
        <section id="login-page" class="w-11/12 mx-auto min-h-screen flex items-center justify-center">
            <div class="card w-full max-w-sm shadow-2xl bg-base-100 border border-gray-200">
                <div class="card-body">
                    <h2 class="card-title justify-center text-2xl font-bold mb-4">Login</h2>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Email</span>
                        </label>
                        <input type="email" placeholder="email" class="input input-bordered" required />
                    </div>
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text">Password</span>
                        </label>
                        <input type="password" placeholder="password" class="input input-bordered" required />
                    </div>
                    <div class="form-control mt-6">
                        <button onclick="performLogin()" class="btn bg-[#422AD5] text-white hover:bg-[#3221a0]">Login</button>
                    </div>
                </div>
            </div>
        </section>

    <script>
        // LOGIN LOGIC
        function performLogin() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('main-page').classList.remove('hidden');
            localStorage.setItem('isLoggedIn', 'true');
            handleNavigation('learn_part');
        }
        function performLogout() {
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('main-page').classList.add('hidden');
            localStorage.removeItem('isLoggedIn');
        }

        // NAVIGATION LOGIC
        function handleNavigation(sectionId) {
            const sections = document.querySelectorAll('.content-section');
            sections.forEach(section => section.classList.add('hidden-section'));

            const activeSection = document.getElementById(sectionId);
            if(activeSection) activeSection.classList.remove('hidden-section');

            const navButtons = document.querySelectorAll('.nav-btn');
            navButtons.forEach(btn => {
                btn.classList.remove('bg-[#422AD5]', 'text-white');
                btn.classList.add('text-[#422AD5]'); 
                if(btn.getAttribute('data-target') === sectionId) {
                    btn.classList.add('bg-[#422AD5]', 'text-white');
                    btn.classList.remove('text-[#422AD5]');
                }
            });
            localStorage.setItem('activePage', sectionId);
        }
 </script>
</body>
</html>
